name: Daily Windows build

on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.preset }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        preset: [ci-windows-editor-debug, ci-windows-game-release]
    defaults:
      run:
        shell: pwsh
    env:
      VULKAN_VERSION: 1.4.357.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          submodules: recursive

      - name: Set up MSVC 2026 and vcpkg
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -version '[18.0,19.0)' -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'Visual Studio 2026 C++ tools are required' }
          & "$vs\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          # Persist the developer shell for subsequent steps.
          foreach ($name in @('PATH', 'INCLUDE', 'LIB', 'LIBPATH', 'VSINSTALLDIR', 'VCINSTALLDIR', 'VCToolsInstallDir', 'WindowsSdkDir', 'WindowsSDKVersion')) {
            "$name=$([Environment]::GetEnvironmentVariable($name))" >> $env:GITHUB_ENV
          }
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          if (!$vcpkg -or !(Test-Path "$vcpkg\scripts\buildsystems\vcpkg.cmake")) { throw 'Runner vcpkg installation missing' }
          & "$vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE) { throw 'vcpkg bootstrap failed' }
          "VCPKG_ROOT=$vcpkg" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force "$env:LOCALAPPDATA\vcpkg\archives" | Out-Null

      - uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/vcpkg/archives
            ~/AppData/Local/vcpkg/downloads
          key: vcpkg-vs2026-${{ matrix.preset }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlays/**') }}
          restore-keys: |
            vcpkg-vs2026-${{ matrix.preset }}-

      - name: Install Vulkan SDK
        run: |
          $installer = "$env:RUNNER_TEMP\vulkan-sdk.exe"
          $sdk = "$env:RUNNER_TEMP\VulkanSDK"
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkan_sdk.exe" -OutFile $installer
          $process = Start-Process -FilePath $installer -ArgumentList @('--root', $sdk, '--accept-licenses', '--default-answer', '--confirm-command', 'install') -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Vulkan SDK installation failed: $($process.ExitCode)" }
          if (!(Test-Path "$sdk\Bin\slangc.exe")) { throw 'Vulkan SDK slangc missing' }
          "VULKAN_SDK=$sdk" >> $env:GITHUB_ENV
          "$sdk\Bin" >> $env:GITHUB_PATH

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.preset }}
          path: builds/${{ matrix.preset }}/Testing/Temporary/
          if-no-files-found: ignore

  notify:
    needs: build
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = 'Daily Windows CI build failing';
            const body = `Build or tests failed on master: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {...context.repo, state: 'open', creator: 'github-actions[bot]'});
            const existing = issues.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({...context.repo, issue_number: existing.number, body});
            } else {
              await github.rest.issues.create({...context.repo, title, body});
            }
